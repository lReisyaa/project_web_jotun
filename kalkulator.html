<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Cat</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .kalkulator-container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .kalkulator-container h1 {
            color: #cc0000;
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }
        .btn-hitung {
            width: 100%;
            padding: 12px;
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-hitung:hover {
            background: #990000;
        }
        .hasil-container {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 5px;
            display: none;
        }
        .hasil-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        .hasil-item:last-child {
            border-bottom: none;
        }
        .hasil-value {
            color: #cc0000;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #cc0000;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="kalkulator-container">
        <h1>🧮 Kalkulator Kebutuhan Cat</h1>
        <p style="text-align: center; margin-bottom: 30px;">Hitung berapa banyak cat yang Anda butuhkan</p>
        
        <div class="form-group">
            <label>Panjang Ruangan (meter)</label>
            <input type="number" id="panjang" placeholder="Contoh: 4">
        </div>
        <div class="form-group">
            <label>Lebar Ruangan (meter)</label>
            <input type="number" id="lebar" placeholder="Contoh: 5">
        </div>
        <div class="form-group">
            <label>Daya Sebar Cat (m²/liter)</label>
            <select id="dayaSebar">
                <option value="10">Jotun Interior - 10 m²/liter</option>
                <option value="12">Jotun Eksterior - 12 m²/liter</option>
                <option value="15">Jotun Wood Care - 15 m²/liter</option>
            </select>
        </div>
        <div class="form-group">
            <label>Jumlah Lapisan</label>
            <select id="lapisan">
                <option value="1">1 Lapisan</option>
                <option value="2" selected>2 Lapisan (Rekomendasi)</option>
                <option value="3">3 Lapisan</option>
            </select>
        </div>
        
        <button class="btn-hitung" onclick="hitungCat()">Hitung Kebutuhan</button>
        
        <div class="hasil-container" id="hasilContainer">
            <h3 style="margin-bottom: 15px;">Hasil Perhitungan:</h3>
            <div class="hasil-item">
                <span>Luas Ruangan</span>
                <span class="hasil-value" id="hasilLuas">-</span>
            </div>
            <div class="hasil-item">
                <span>Total Kebutuhan Cat</span>
                <span class="hasil-value" id="hasilKebutuhan">-</span>
            </div>
        </div>
        
        <a href="index.html" class="back-link">← Kembali ke Home</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
